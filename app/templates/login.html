
{% extends "base.html" %}

{% block title %}Login | NaijaProtein AI{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p>Log in to your account.</p>

        <form method="POST">
            <label>Email address</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="{{ url_for('auth.register', next=request.args.get('next')) }}">Register</a></p>
    </div>
</section>
{% endblock %}
